services:
  redis:
    image: redis:7-alpine
    container_name: dragbizz_ai_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: dragbizz_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200\\|ok\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dragbizz-ai:
    build: .
    container_name: dragbizz_ai
    ports:
      - "${HOST_HTTP_PORT:-8005}:${AI_PORT:-4004}"
    env_file:
      - .env
    environment:
      AI_QDRANT_URL: http://qdrant:6333
      AI_REDIS_URL: redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "4004",
        "--reload",
      ]
    volumes:
      - ./app:/app/app
      - ./knowledge:/app/knowledge:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dragbizz.local:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4004/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  ai_redis_data:
