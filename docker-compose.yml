services:
  dragbizz-ai:
    build: .
    container_name: dragbizz_ai
    ports:
      - "4004:4004"
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-development}
      AI_HOST: 0.0.0.0
      AI_PORT: 4004
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_DOCS_ENABLED: ${AI_DOCS_ENABLED:-true}
      AI_RETAILER_SERVICE_URL: ${AI_RETAILER_SERVICE_URL:-http://dragbizz.local/retailer}
      AI_AUTH_SERVICE_URL: ${AI_AUTH_SERVICE_URL:-http://dragbizz.local/auth}
      AI_UTILITY_SERVICE_URL: ${AI_UTILITY_SERVICE_URL:-http://dragbizz.local/utility}
    volumes:
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dragbizz.local:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4004/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
