version: "3.9"

services:
  api:
    build: .
    container_name: dragbizz-api
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "4003:8000"  # host:container
    volumes:
      - ./:/app  # enable live reload by syncing source into container

