version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: dragbizz-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: dragbizz-api
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "4003:8000"
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data: