[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dragbizz-ai"
version = "0.1.0"
description = "Provider-independent AI orchestration service for DragBizz"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "jsonschema",
  "motor",
  "pydantic-settings",
  "PyJWT[crypto]",
  "qdrant-client",
  "redis",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
